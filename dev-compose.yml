version: '3'
services:
  fpl_aa_web_demo:
    container_name: fpl_aa_dev
    build:
      context: .
      dockerfile: Dockerfile-dev
    environment:
      - PYTHONUNBUFFERED=1
      - LANG=C.UTF-8
    ports:
      - "8001:8001"
    volumes:
      - ./src:/app
      # Local checkout of the `webpage` branch (git worktree at ../fpl_optimized_build)
      - ../fpl_optimized_build:/app/build
